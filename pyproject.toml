[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "panopticon"
dynamic = ["version"]
description = "Terminal real-time network traffic analyzer and lightweight NIDS."
readme = "README.md"
authors = [
    { name = "Aredain", email = "luciano.sparti@proton.me" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["network", "packet-analyzer", "nids", "sniffer", "scapy", "tui", "rich", "security", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0,<3.0",
    "rich>=13.0.0,<16.0",
    "tomli>=1.1.0; python_version < '3.11'",
    "typing_extensions>=4.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/luciano-sparti/panopticon"
Repository = "https://github.com/luciano-sparti/panopticon.git"
Issues = "https://github.com/luciano-sparti/panopticon/issues"
Documentation = "https://github.com/luciano-sparti/panopticon#readme"
Funding = "https://ko-fi.com/lucianosp"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0,<4",
    "pytest>=7.0.0,<10",
    "ruff>=0.6.0,<1",
]

[project.scripts]
panopticon = "panopticon.analyzer:main"

[tool.setuptools.packages.find]
include = ["panopticon*"]
exclude = ["panopticon.tests*"]

[tool.setuptools.dynamic]
version = { attr = "panopticon.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "S110",
    "S112",
    "SIM",
    "RET",
    "PYI",
    "RUF",
    "PLE0308",
    "PLR1711",
    "DTZ006",
]

[tool.ruff.lint.per-file-ignores]
# Dev smoke harnesses inject the repo root on sys.path before importing scapy.
"panopticon/tests/_smoke_*.py" = ["E402"]
# The TUI intentionally uses semantic unicode glyphs (ℹ ⚠ ⛔ ▲ ▼ ↔) for
# colorblind dual-coding; they are not accidental lookalikes.
"panopticon/ui/*.py" = ["RUF001"]
# /proc/net tcp/udp fixtures are deliberately verbatim-width so the parser
# sees the same column alignment real kernels emit.
"panopticon/tests/test_procs.py" = ["E501"]

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
